[package]
name = "daihon"
version = "0.1.0"
edition = "2024"
description = "Daihon — Scenario-driven development harness for coding agents"

[[bin]]
name = "daihon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
toml = "0.8"
ureq = "2.12"

[dev-dependencies]
tempfile = "3.15"
